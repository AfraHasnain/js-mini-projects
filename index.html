<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>js-mini-projects</title>
  </head>
  <style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }
    body{
        background: linear-gradient(135deg, #ffeef5, palevioletred);
        padding: 30px;
        display: flex;
        flex-direction: column;
        gap: 30px;
        align-items: center;
    }
    .card{
        background: white;
        width: 340px;
        padding: 25px;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(255. 106, 157, 0.15);
        text-align: center;
    }
    h2{
        color: palevioletred;
        margin-bottom: 15px;
        text-transform: uppercase;
    }
    input{
        width: 70%;
        padding: 10px;
        border: 2px solid #ffc2d9;
        border-radius: 10px;
        outline: none;
    }
    button{
        padding: 10px 15px;
        border: 2px solid transparent;
        border-radius: 10px;
        background: #ff6a9d;
        color: white;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.3s ease;
        cursor: pointer;
    }
    button:hover {
        transform: scale(1.05); 
        color: #ff5c8a;
        border: 2px solid #ff5c8a;
        background: none;
    }
    ul{
        list-style: none;
        margin-top: 15px;
        text-align: left;
    }
    li{
        background: #fff5f8;
        padding: 10px;
        border-radius: 10px;
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    li button{
        background: #ff4d6d;
        padding: 5px 10px;
        font-size: 12px;
    }
    #count{
        font-size: 50px;
        margin: 15px 0;
        color: #333;
    }
    #myImage{
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 15px;
        margin-bottom: 15px;
    }
  </style>
  <body>
    <!-- To-Do List -->
    <div class="card">
      <h2>1. To-Do List</h2>
      <input type="text" id="todoInput" placeholder="Add new task..." />
      <button onclick="addTask()">Add</button>
      <ul id="todoList"></ul>
    </div>

    <!-- Counter -->
    <div class="card">
      <h2>2. Counter</h2>
      <div id="count">0</div>
      <button onclick="decrease()">-</button>
      <button onclick="reset()">Reset</button>
      <button onclick="increase()">+</button>
    </div>

    <!-- Image changer -->
    <div class="card">
      <h2>3. Image changer</h2>
      <img
        id="myImage"
        src="https://picsum.photos/340/180?random=1"
        alt="Image"
      />
      <br />
      <button onclick="changeImage()">Change Image</button>
    </div>

    <script>
      //  To-Do List
      function addTask() {
        let input = document.getElementById("todoInput");
        let text = input.value.trim();
        if (text === "") return;
        let li = document.createElement("li");
        li.innerHTML =
          text +
          '<button onclick="this.parentElement.remove()">Delete</button>';
        document.getElementById("todoList").appendChild(li);
        input.value = "";
      }

      // Counter
      let count = 0;
      function increase() {
        count++;
        document.getElementById("count").innerText = count;
      }
      function decrease() {
        count--;
        document.getElementById("count").innerText = count;
      }
      function reset() {
        count = 0;
        document.getElementById("count").innerText = count;
      }

      // Image Changer
      let imgNum = 1;
      function changeImage() {
        imgNum++;
        document.getElementById("myImage").src =
          "https://picsum.photos/340/180?random=" + imgNum;
      }
    </script>
  </body>
</html>
